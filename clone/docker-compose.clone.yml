# ─── Clone environment (Sistema 2, puerto 8087) ─────────────────────
# Fully isolated stack for the second system on the same VPS.
# Lives in a subfolder of the repo root (one repo copy, one subfolder per instance).
# Usage (from repo root):
#   docker compose -f clone/docker-compose.clone.yml --env-file clone/.env.clone up --build -d
# Requires: clone/.env.clone and the repo Dockerfile (build context = repo root)

services:
  db:
    image: postgres:15
    restart: always
    env_file:
      - .env.clone
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_clone_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      retries: 5

  web:
    build: ../
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3 --timeout 120"
    volumes:
      - ../static:/app/static
      - static_clone:/app/staticfiles
    env_file:
      - .env.clone
    depends_on:
      db:
        condition: service_healthy
    restart: always

  nginx:
    image: nginx:stable-alpine
    restart: always
    ports:
      - "8087:80"
    volumes:
      - ./nginx.clone.conf:/etc/nginx/conf.d/default.conf
      - static_clone:/app/staticfiles
    depends_on:
      - web

volumes:
  postgres_clone_data:
  static_clone: