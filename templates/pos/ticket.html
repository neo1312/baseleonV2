<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Imprimir ticket - {{ store_name }}</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#f0f0f0;color:#333;font-family:-apple-system,BlinkMacSystemFont,sans-serif;display:flex;justify-content:center;padding:16px;min-height:100dvh}
.container{width:100%;max-width:420px;display:flex;flex-direction:column;gap:14px}
.header{background:#fff;border-radius:10px;padding:16px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.header h1{font-size:1.2rem;color:#444;font-weight:600}
.header p{font-size:.8rem;color:#999;margin-top:4px}
.card{background:#fff;border-radius:10px;padding:16px;box-shadow:0 1px 3px rgba(0,0,0,.1);display:flex;flex-direction:column;gap:12px}
label{font-size:.85rem;color:#666;font-weight:500}
input[type=text],input[type=number],select{width:100%;padding:14px;font-size:1.1rem;border:1px solid #ccc;border-radius:8px;background:#fafafa;color:#333;outline:none}
input:focus,select:focus{border-color:#888;background:#fff}
.btn{width:100%;padding:14px;font-size:1.05rem;border:none;border-radius:8px;cursor:pointer;color:#fff;font-weight:600;background:#2a7a4a}
.btn:active{opacity:.85}
#feedback{padding:12px;border-radius:8px;text-align:center;font-weight:600;font-size:.95rem;display:none}
#feedback.ok{background:#d4edda;color:#155724;display:block}
#feedback.err{background:#f8d7da;color:#721c24;display:block}
.footer{text-align:center;font-size:.75rem;color:#aaa}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>{{ store_name }}</h1>
    <p>Reimpresión de tickets</p>
  </div>
  <div class="card">
    <label for="ticket_type">Tipo</label>
    <select id="ticket_type">
      <option value="sale">Venta</option>
      <option value="quote">Cotización</option>
      <option value="devolution">Devolución</option>
    </select>
    <label for="sale_id">ID del ticket</label>
    <input type="number" id="sale_id" inputmode="numeric" autocomplete="off" placeholder="Ej. 1954">
    <button class="btn" onclick="printTicket()">Imprimir ticket</button>
    <div id="feedback"></div>
  </div>
  <div class="footer">Ferreteria - Sistema de tickets</div>
</div>
<script>
function showFeedback(msg, ok) {
  var el = document.getElementById('feedback');
  el.textContent = msg;
  el.className = ok ? 'ok' : 'err';
}
function printTicket() {
  var saleId = document.getElementById('sale_id').value.trim();
  var ticketType = document.getElementById('ticket_type').value;
  if (!saleId) { showFeedback('Ingresa el ID del ticket', false); return; }
  if (!/^[0-9]+$/.test(saleId)) { showFeedback('El ID debe ser un número', false); return; }
  fetch('/pos/print-jobs/', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({job_type: 'ticket', sale_id: parseInt(saleId, 10), ticket_type: ticketType})
  })
  .then(function(r) { return r.json(); })
  .then(function(d) {
    if (d.success) { showFeedback('Ticket enviado a la cola (# ' + d.job_id + ')', true); }
    else { showFeedback('Error: ' + (d.error || 'desconocido'), false); }
  })
  .catch(function(err) { showFeedback('Error de red: ' + err.message, false); });
}
</script>
</body>
</html>
